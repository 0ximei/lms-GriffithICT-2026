<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Griffith LMS TikTok Overlay</title>
    <style>
      body {
        width: 260px;
        font: 13px/1.4 system-ui, sans-serif;
        padding: 14px;
        margin: 0;
        background: #111;
        color: #eee;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 10px;
        color: #aaa;
      }
      .status {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: #1f6f3b;
        color: #fff;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Griffith LMS TikTok Overlay</h1>
    <p>The extension now opens a TikTok video overlay on Griffith LMS pages.</p>
    <div class="status" id="status">Enabled</div>
    <script src="popup.js"></script>
  </body>
</html>
